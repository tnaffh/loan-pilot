# Installed at /var/www/vhosts/system/raccoonsfinance.com/conf/vhost_nginx.conf
# Apply with:
#   plesk sbin httpdmng --reconfigure-domain raccoonsfinance.com
#
# Fronts the public marketing + apply site (loanpilot-web) on 127.0.0.1:3000.
# Plesk's generated HTTPS server block includes this file and defines no `location /`
# of its own, so the block below is the only one — and Plesk keeps owning TLS, the
# HTTP->HTTPS redirect and the ACME challenge.

# Next.js emits a preload `Link:` response header spanning every chunk of the page —
# several KB, larger than nginx's default proxy buffer, which turns affected pages into
# 502 "upstream sent too big header". city-pilot hit the identical bug through fastcgi.
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
