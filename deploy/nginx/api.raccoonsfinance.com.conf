# Installed at /var/www/vhosts/system/api.raccoonsfinance.com/conf/vhost_nginx.conf
# Apply with:
#   plesk sbin httpdmng --reconfigure-domain api.raccoonsfinance.com
#
# Fronts the NestJS API (loanpilot-api) on 127.0.0.1:4000. The API serves /api/* and,
# with the local storage driver only, /uploads/* — both go through the one location.

# The API accepts 10 MB multipart uploads (MAX_BYTES in upload.config.ts) and 5 MB JSON
# bodies (inline signature data-URLs). nginx defaults to 1 MB, which would 413 every
# borrower ID scan and bank statement over that size — with an opaque error, and only on
# real documents, so a smoke test with a small file would not catch it.
client_max_body_size 12m;

# Report and agreement generation is synchronous, in-process pdfkit/xlsx. A large
# quarterly return can outrun nginx's 60s default.
proxy_read_timeout 120s;

proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;

location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- CUTOVER ONLY -----------------------------------------------------------------
# Swap the block above for this one for the first few minutes after the DNS flip. It
# holds the API read-only so you can confirm real traffic is arriving and rendering
# before the databases diverge — making the point of no return a switch you throw
# rather than one a user throws for you. Remove it and reconfigure once satisfied.
#
# Do NOT use `ALTER DATABASE ... SET default_transaction_read_only` instead: it applies
# per session, so Prisma's already-open pool ignores it.
